# ActorRise – Render Blueprint
# Deploy: connect this repo in Render, then use "New" → "Blueprint" and point to this file.
# Or create a Web Service manually and set build to Docker with dockerfilePath: ./backend/Dockerfile, dockerContext: ./backend.

# No `databases:` block on purpose. Postgres lives in Supabase, not Render.
# The old actorrise-db was a leftover from before that migration: zero open
# connections, and re-declaring it here would both re-provision a ~$6/mo
# instance and risk a blueprint sync repointing DATABASE_URL at an empty DB.

services:
  - type: web
    name: actorrise-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Must match the live instance type. `free` here would let a blueprint sync
    # downgrade the API to an instance that sleeps after 15 min idle.
    plan: starter

    # Build only when backend changes (monorepo)
    buildFilter:
      paths:
        - backend/**

    # DATABASE_URL is deliberately NOT here: it's the Supabase pooler URL and is
    # set in the Dashboard as a secret. Set the rest there too.
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://actorrise.vercel.app
        # Add your Vercel frontend URL(s), comma-separated. Example: https://yourapp.vercel.app,https://www.yourapp.com
      # Set these in Render Dashboard → Service → Environment (secrets):
      # - JWT_SECRET (generate a long random string)
      # - SUPABASE_URL (your Supabase project URL)
      # - SUPABASE_SERVICE_ROLE_KEY (Supabase service role key)
      # - OPENAI_API_KEY (if you use AI search)

    healthCheckPath: /health
    autoDeployTrigger: commit
